name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Verify tag matches package.json version
      # Guard: meaningful only on tag pushes (the workflow's intended
      # trigger). On non-tag runs the derived tag is empty and the
      # comparison would wrongly fail.
      if: github.ref_type == 'tag'
      run: |
        TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
        PKG_VERSION=$(node -p "require('./package.json').version")

        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "❌ Error: Tag version (v$TAG_VERSION) does not match package.json version ($PKG_VERSION)"
          echo "Please ensure the tag version matches the version in package.json"
          exit 1
        fi

        echo "✅ Tag version matches package.json version: $TAG_VERSION"

    - name: Create Release Archive
      run: |
        tar -czf docker-mcp-server-${{ steps.get_version.outputs.VERSION }}.tar.gz \
          dist/ package.json package-lock.json README.md LICENSE CONFIGURATION.md EXAMPLES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: docker-mcp-server-${{ steps.get_version.outputs.VERSION }}.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-secrets:
    name: Check NPM_TOKEN
    runs-on: ubuntu-latest
    needs: release
    # Republishes the NPM_TOKEN presence as a job OUTPUT: job-level `if:`
    # may only reference the github, needs, vars and inputs contexts, so
    # the secret is read here — in a step, where the `secrets` context IS
    # allowed — and the npm-publish job gates on the output below.
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    permissions:
      contents: read

    steps:
    - name: Check NPM_TOKEN
      id: check
      run: |
        if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release, check-secrets]
    # Job-level `if:` may only reference the github, needs, vars and
    # inputs contexts (plus the always/cancelled/success/failure status
    # functions). Neither `secrets` nor `env` is permitted there — both
    # make GitHub reject the ENTIRE workflow at parse time. The
    # check-secrets job above reads the secret where it IS allowed and
    # republishes its presence as a job output, which this condition
    # gates on.
    if: needs.check-secrets.outputs.ok == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Verify tag matches package.json version
      # Guard: meaningful only on tag pushes (the workflow's intended
      # trigger). On non-tag runs the derived tag is empty and the
      # comparison would wrongly fail.
      if: github.ref_type == 'tag'
      run: |
        TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
        PKG_VERSION=$(node -p "require('./package.json').version")

        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "❌ Error: Tag version (v$TAG_VERSION) does not match package.json version ($PKG_VERSION)"
          echo "Aborting npm publish to prevent version mismatch"
          exit 1
        fi

        echo "✅ Tag version matches package.json version: $TAG_VERSION"

    - name: Verify package contents
      run: |
        npm pack --dry-run
        echo "Package contents verified"

    - name: Publish to npm
      # Step-level env DOES permit the secrets context — the token is
      # read directly here instead of via an env-context indirection.
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
